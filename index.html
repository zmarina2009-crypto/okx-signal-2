<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0f14"><link rel="manifest" href="manifest.webmanifest"><title>OKX Signal Pro</title><style>body{margin:0;background:#0b0f14;color:#e8edf3;font:14px system-ui;padding:12px}main{max-width:900px;margin:auto}.card{background:#111821;border:1px solid #26313d;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;flex-wrap:wrap;gap:8px}select,input,button{background:#0c131b;color:#e8edf3;border:1px solid #33404d;border-radius:9px;padding:9px}.signal{font-size:30px;font-weight:800}.long{color:#50e3a4}.short{color:#ff6b7a}.muted{color:#8995a3}canvas{width:100%;height:280px;background:#0c131b;border-radius:10px}</style></head><body><main><div class="card"><b style="font-size:20px">OKX Signal Pro</b><div class="muted">PWA • 15m • SMA + Volume</div></div><div class="card"><div class="row"><select id="p"></select><select id="tf"><option>1m</option><option>5m</option><option selected>15m</option><option>1H</option><option>4H</option></select><label>SMA <input id="f" value="20" size="3"> / <input id="s" value="60" size="3"></label><label>Vol × <input id="vx" value="2" size="3"></label><button id="go">Обновить</button><button id="install" hidden>Установить</button></div></div><div class="card"><div id="sig" class="signal">Загрузка…</div><div id="d" class="muted"></div><canvas id="c" width="900" height="280"></canvas></div><div class="card"><b>Журнал</b><div id="log" class="muted"></div></div><div class="card muted">Публичные данные OKX. Автоторговля отключена. Для установки PWA нужен HTTPS.</div></main><script>const ps=["BTC-USDT","ETH-USDT","SOL-USDT","BNB-USDT","XRP-USDT","DOGE-USDT","ADA-USDT","AVAX-USDT","TON-USDT","SHIB-USDT"],$=x=>document.getElementById(x);ps.forEach(x=>$("p").add(new Option(x,x)));let logs=JSON.parse(localStorage.logs||"[]"),dp=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("install").hidden=false});$("install").onclick=()=>dp?.prompt();navigator.serviceWorker?.register("sw.js");function sma(a,n){return a.length<n?null:a.slice(-n).reduce((x,y)=>x+y,0)/n}async function data(p,b){let j=await (await fetch(`https://www.okx.com/api/v5/market/candles?instId=${p}&bar=${b}&limit=120`)).json();return j.data}async function run(){let p=$("p").value,b=$("tf").value,f=+$("f").value,s=+$("s").value,vx=+$("vx").value,a=await data(p,b),cl=a.map(x=>+x[4]).reverse(),vo=a.map(x=>+x[5]).reverse(),sf=sma(cl,f),ss=sma(cl,s),sv=sma(vo,20),last=cl.at(-1),h=await data(p,"1H"),hc=h.map(x=>+x[4]).reverse(),hf=sma(hc,f),hs=sma(hc,s),trend=hf>hs?"UP":hf<hs?"DOWN":"FLAT",bull=last>cl.at(-2),long=sf>ss&&last>sf&&vo.at(-1)>=sv*vx&&bull&&trend=="UP",short=sf<ss&&last<sf&&vo.at(-1)>=sv*vx&&!bull&&trend=="DOWN",side=long?"LONG":short?"SHORT":"NO SIGNAL";$("sig").textContent=side;$("sig").className="signal "+(long?"long":short?"short":"");$("d").textContent=`${p} • Close ${last} • SMA${f} ${sf?.toFixed(2)} • SMA${s} ${ss?.toFixed(2)} • Volume ${(vo.at(-1)/sv).toFixed(2)}× • 1H ${trend}`;let ctx=$("c").getContext("2d"),w=900,H=280,z=cl.slice(-80),hi=Math.max(...z),lo=Math.min(...z);ctx.clearRect(0,0,w,H);ctx.beginPath();z.forEach((v,i)=>{let x=i*(w-1)/(z.length-1),y=15+(hi-v)*250/(hi-lo||1);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();if(long||short){let key=p+side+Math.floor(Date.now()/900000);if(!logs.some(x=>x.k==key)){logs.unshift({k:key,p,side,last,t:new Date().toLocaleString()});logs=logs.slice(0,100);localStorage.logs=JSON.stringify(logs);if(Notification?.permission==="granted")new Notification(side,{body:p+" • "+last})}}$("log").innerHTML=logs.map(x=>`<div>${x.t} — <b>${x.p}</b> — ${x.side} — ${x.last}</div>`).join("")||"Пока сигналов нет"}$("go").onclick=run;$("p").onchange=run;run();setInterval(run,60000);</script></body></html>
